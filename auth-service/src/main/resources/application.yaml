spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://localhost:5432/chadet_auth
    username: chadet_user
    password: chadet_password
    driver-class-name: org.postgresql.Driver
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:chadet}
    password: ${RABBITMQ_PASSWORD:chadet_password}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    connect-retries: 30
    connect-retries-interval: 5
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

chadet:
  jwt:
    private-key: 
    public-key: 
  
server:
  port: 8081

logging:
  level:
    com.tienvm.auth: INFO