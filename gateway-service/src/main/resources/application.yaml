spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/auth/**, /api/users/**
            - id: chat-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/conversations/**, /api/messages/**
            - id: trade-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/trades/**
            - id: chat-ws
              uri: ws://localhost:8082
              predicates:
                - Path=/ws/**
          globalcors:
            cors-configurations:
              '[/api/**]':
                allowed-origin-patterns: ["http://localhost:*"]
                allowed-methods: ["*"]
                allowed-headers: ["*"]

chadet:
  jwt:
    public-key: 

server:
  port: 8080