services:
  postgres:
    image: docker.io/library/postgres:17-alpine
    environment:
      - POSTGRES_DB=chadet_chat
      - POSTGRES_USER=chadet_chat
      - POSTGRES_PASSWORD=chadet_chat_password
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: