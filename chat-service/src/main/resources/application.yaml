spring:
  application:
    name: chat-service
  datasource:
    url: jdbc:postgresql://localhost:5434/chadet_chat
    username: chadet_chat
    password: chadet_chat_password
    driver-class-name: org.postgresql.Driver
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:chadet}
    password: ${RABBITMQ_PASSWORD:chadet_password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    connect-retries: 30
    connect-retries-interval: 5
  websocket:
    enabled: true
    allowed-origin-patterns: 
      - http://localhost:*

chadet:
  jwt:
    public-key: 

server:
  port: 8082

logging:
  level:
    com.tienvm.chat: INFO
