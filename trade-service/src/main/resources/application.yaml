spring:
  application:
    name: trade-service
  datasource:
    url: jdbc:postgresql://localhost:5433/chadet_trade
    username: chadet_trade
    password: chadet_password
    driver-class-name: org.postgresql.Driver
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:chadet}
    password: ${RABBITMQ_PASSWORD:chadet_password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    connect-retries: 30
    connect-retries-interval: 5

chadet:
  jwt:
    public-key: 

server:
  port: 8083

logging:
  level:
    com.tienvm.trade: INFO
